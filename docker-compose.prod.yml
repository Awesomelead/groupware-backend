version: '3.8'

services:
  app:
    image: 188932086032.dkr.ecr.ap-northeast-2.amazonaws.com/groupware-backend:latest
    container_name: groupware-backend-prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JWT_SECRET=${JWT_SECRET}
      - SPRING_JWT_ACCESS_VALIDATION=${JWT_ACCESS_VALIDATION}
      - SPRING_JWT_REFRESH_VALIDATION=${JWT_REFRESH_VALIDATION}
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${AWS_S3_ACCESS_KEY}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${AWS_S3_SECRET_KEY}
      - SPRING_CLOUD_AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - SPRING_CLOUD_AWS_REGION_STATIC=ap-northeast-2
      - ALIGO_API_URL=${ALIGO_API_URL}
      - ALIGO_API_APIKEY=${ALIGO_API_KEY}
      - ALIGO_API_USERID=${ALIGO_USER_ID}
      - ALIGO_API_SENDERKEY=${ALIGO_SENDER_KEY}
      - ALIGO_API_SENDER=${ALIGO_SENDER_PHONE}
      - ALIGO_API_TPL_CODE=${ALIGO_TPL_CODE}
      - ALIGO_API_TEST_MODE=${ALIGO_TEST_MODE}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT}
      - PORTONE_APISECRET=${PORTONE_APISECRET}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
      - MULTIPART_MAX_FILE_SIZE=${MULTIPART_MAX_FILE_SIZE}
      - MULTIPART_MAX_REQUEST_SIZE=${MULTIPART_MAX_REQUEST_SIZE}
      - TOMCAT_MAX_HTTP_FORM_POST_SIZE=${TOMCAT_MAX_HTTP_FORM_POST_SIZE:-100MB}
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=${MULTIPART_MAX_FILE_SIZE}
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=${MULTIPART_MAX_REQUEST_SIZE}
      - SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE=${TOMCAT_MAX_HTTP_FORM_POST_SIZE:-100MB}
      - HANBIRO_SSO_BASE_URL=${HANBIRO_SSO_BASE_URL}
      - HANBIRO_SSO_AUTH_PATH=${HANBIRO_SSO_AUTH_PATH}
      - HANBIRO_SSO_CREATE_TOKEN_PATH=${HANBIRO_SSO_CREATE_TOKEN_PATH}
      - HANBIRO_SSO_RAW=${HANBIRO_SSO_RAW}
      - HANBIRO_SSO_METHOD=${HANBIRO_SSO_METHOD}
      - TZ=Asia/Seoul
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - prod-network

  redis:
    image: redis:7-alpine
    container_name: groupware-redis-prod
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-prod-data:/data
    restart: unless-stopped
    networks:
      - prod-network

  prometheus:
    image: prom/prometheus
    container_name: groupware-prometheus-prod
    volumes:
      - ./monitoring/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - prod-network

  grafana:
    image: grafana/grafana
    container_name: groupware-grafana-prod
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=https://api.awesomelead.co.kr/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-prod-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - prod-network

volumes:
  redis-prod-data:
    name: redis-prod-data
    driver: local
  grafana-prod-data:
    name: grafana-prod-data
    driver: local

networks:
  prod-network:
    name: prod-network
    driver: bridge
