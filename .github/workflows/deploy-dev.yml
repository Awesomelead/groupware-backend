name: Deploy Dev to EC2

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push dev Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: groupware-backend
          IMAGE_TAG: dev
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Prepare dev directory on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/groupware-dev

      - name: Copy docker-compose.dev.yml to EC2 (1st attempt)
        id: scp_copy
        continue-on-error: true
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./docker-compose.dev.yml"
          target: "/home/ubuntu/groupware-dev"
          overwrite: true

      - name: Retry copy docker-compose.dev.yml to EC2 (if failed)
        if: steps.scp_copy.outcome == 'failure'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./docker-compose.dev.yml"
          target: "/home/ubuntu/groupware-dev"
          overwrite: true

      - name: Deploy dev to EC2 with Docker Compose
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 188932086032.dkr.ecr.ap-northeast-2.amazonaws.com

            cat > /home/ubuntu/groupware-dev/.env << EOF
            DEV_BACKEND_IMAGE=188932086032.dkr.ecr.ap-northeast-2.amazonaws.com/groupware-backend:dev
            DEV_DB_USERNAME=${{ secrets.DEV_DB_USERNAME }}
            DEV_DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            DEV_DB_ROOT_PASSWORD=${{ secrets.DEV_DB_ROOT_PASSWORD }}
            DEV_JWT_SECRET=${{ secrets.DEV_JWT_SECRET }}
            DEV_JWT_ACCESS_VALIDATION=${{ secrets.DEV_JWT_ACCESS_VALIDATION }}
            DEV_JWT_REFRESH_VALIDATION=${{ secrets.DEV_JWT_REFRESH_VALIDATION }}
            DEV_AWS_S3_ACCESS_KEY=${{ secrets.DEV_AWS_S3_ACCESS_KEY }}
            DEV_AWS_S3_SECRET_KEY=${{ secrets.DEV_AWS_S3_SECRET_KEY }}
            DEV_AWS_S3_BUCKET=${{ secrets.DEV_AWS_S3_BUCKET }}
            DEV_ALIGO_API_URL=${{ secrets.DEV_ALIGO_API_URL }}
            DEV_ALIGO_API_KEY=${{ secrets.DEV_ALIGO_API_KEY }}
            DEV_ALIGO_USER_ID=${{ secrets.DEV_ALIGO_USER_ID }}
            DEV_ALIGO_SENDER_KEY=${{ secrets.DEV_ALIGO_SENDER_KEY }}
            DEV_ALIGO_SENDER_PHONE=${{ secrets.DEV_ALIGO_SENDER_PHONE }}
            DEV_ALIGO_TPL_CODE=${{ secrets.DEV_ALIGO_TPL_CODE }}
            DEV_ALIGO_TEST_MODE=${{ secrets.DEV_ALIGO_TEST_MODE }}
            DEV_SPRING_JPA_HIBERNATE_DDL_AUTO=${{ secrets.DEV_SPRING_JPA_HIBERNATE_DDL_AUTO }}
            DEV_SPRING_MAIL_HOST=${{ secrets.DEV_SPRING_MAIL_HOST }}
            DEV_SPRING_MAIL_PORT=${{ secrets.DEV_SPRING_MAIL_PORT }}
            DEV_SPRING_MAIL_USERNAME=${{ secrets.DEV_SPRING_MAIL_USERNAME }}
            DEV_SPRING_MAIL_PASSWORD=${{ secrets.DEV_SPRING_MAIL_PASSWORD }}
            DEV_ENCRYPTION_SECRET_KEY=${{ secrets.DEV_ENCRYPTION_SECRET_KEY }}
            DEV_ENCRYPTION_SALT=${{ secrets.DEV_ENCRYPTION_SALT }}
            DEV_PORTONE_APISECRET=${{ secrets.DEV_PORTONE_APISECRET }}
            DEV_FIREBASE_CREDENTIALS_JSON='${{ secrets.DEV_FIREBASE_CREDENTIALS_JSON }}'
            DEV_MULTIPART_MAX_FILE_SIZE=${{ secrets.DEV_MULTIPART_MAX_FILE_SIZE }}
            DEV_MULTIPART_MAX_REQUEST_SIZE=${{ secrets.DEV_MULTIPART_MAX_REQUEST_SIZE }}
            DEV_TOMCAT_MAX_HTTP_FORM_POST_SIZE=${{ secrets.DEV_TOMCAT_MAX_HTTP_FORM_POST_SIZE }}
            DEV_HANBIRO_SSO_BASE_URL=${{ secrets.DEV_HANBIRO_SSO_BASE_URL }}
            DEV_HANBIRO_SSO_AUTH_PATH=${{ secrets.DEV_HANBIRO_SSO_AUTH_PATH }}
            DEV_HANBIRO_SSO_CREATE_TOKEN_PATH=${{ secrets.DEV_HANBIRO_SSO_CREATE_TOKEN_PATH }}
            DEV_HANBIRO_SSO_RAW=${{ secrets.DEV_HANBIRO_SSO_RAW }}
            DEV_HANBIRO_SSO_METHOD=${{ secrets.DEV_HANBIRO_SSO_METHOD }}
            EOF

            cd /home/ubuntu/groupware-dev

            docker-compose -f docker-compose.dev.yml stop app || true
            docker-compose -f docker-compose.dev.yml rm -f app || true
            docker-compose -f docker-compose.dev.yml pull app
            docker-compose -f docker-compose.dev.yml up -d app

            echo "Waiting for dev application to start..."
            sleep 10

            for i in {1..30}; do
              if curl -f http://localhost:8081/ > /dev/null 2>&1; then
                echo "Dev application is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            docker container prune -f
            docker image prune -f
