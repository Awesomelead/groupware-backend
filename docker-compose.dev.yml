version: '3.8'

services:
  app:
    image: ${DEV_BACKEND_IMAGE:-188932086032.dkr.ecr.ap-northeast-2.amazonaws.com/groupware-backend:dev}
    container_name: groupware-backend-dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/groupware_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DEV_DB_USERNAME:-groupware_dev}
      - SPRING_DATASOURCE_PASSWORD=${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      - SPRING_JWT_SECRET=${DEV_JWT_SECRET:?DEV_JWT_SECRET is required}
      - SPRING_JWT_ACCESS_VALIDATION=${DEV_JWT_ACCESS_VALIDATION:-3600000}
      - SPRING_JWT_REFRESH_VALIDATION=${DEV_JWT_REFRESH_VALIDATION:-1209600000}
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${DEV_AWS_S3_ACCESS_KEY:-dev-access-key}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${DEV_AWS_S3_SECRET_KEY:-dev-secret-key}
      - SPRING_CLOUD_AWS_S3_BUCKET=${DEV_AWS_S3_BUCKET:-groupware-dev}
      - SPRING_CLOUD_AWS_REGION_STATIC=ap-northeast-2
      - ALIGO_API_URL=${DEV_ALIGO_API_URL:-}
      - ALIGO_API_APIKEY=${DEV_ALIGO_API_KEY:-}
      - ALIGO_API_USERID=${DEV_ALIGO_USER_ID:-}
      - ALIGO_API_SENDERKEY=${DEV_ALIGO_SENDER_KEY:-}
      - ALIGO_API_SENDER=${DEV_ALIGO_SENDER_PHONE:-}
      - ALIGO_API_TPL_CODE=${DEV_ALIGO_TPL_CODE:-}
      - ALIGO_API_TEST_MODE=${DEV_ALIGO_TEST_MODE:-true}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${DEV_SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_MAIL_HOST=${DEV_SPRING_MAIL_HOST:-localhost}
      - SPRING_MAIL_PORT=${DEV_SPRING_MAIL_PORT:-1025}
      - SPRING_MAIL_USERNAME=${DEV_SPRING_MAIL_USERNAME:-dev}
      - SPRING_MAIL_PASSWORD=${DEV_SPRING_MAIL_PASSWORD:-dev}
      - ENCRYPTION_SECRET_KEY=${DEV_ENCRYPTION_SECRET_KEY:-dev-encryption-secret-key}
      - ENCRYPTION_SALT=${DEV_ENCRYPTION_SALT:-dev-encryption-salt}
      - PORTONE_APISECRET=${DEV_PORTONE_APISECRET:-dev-portone-secret}
      - FIREBASE_CREDENTIALS_JSON=${DEV_FIREBASE_CREDENTIALS_JSON:-}
      - MULTIPART_MAX_FILE_SIZE=${DEV_MULTIPART_MAX_FILE_SIZE:-50MB}
      - MULTIPART_MAX_REQUEST_SIZE=${DEV_MULTIPART_MAX_REQUEST_SIZE:-100MB}
      - TOMCAT_MAX_HTTP_FORM_POST_SIZE=${DEV_TOMCAT_MAX_HTTP_FORM_POST_SIZE:-100MB}
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=${DEV_MULTIPART_MAX_FILE_SIZE:-50MB}
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=${DEV_MULTIPART_MAX_REQUEST_SIZE:-100MB}
      - SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE=${DEV_TOMCAT_MAX_HTTP_FORM_POST_SIZE:-100MB}
      - HANBIRO_SSO_BASE_URL=${DEV_HANBIRO_SSO_BASE_URL:-}
      - HANBIRO_SSO_AUTH_PATH=${DEV_HANBIRO_SSO_AUTH_PATH:-/auth}
      - HANBIRO_SSO_CREATE_TOKEN_PATH=${DEV_HANBIRO_SSO_CREATE_TOKEN_PATH:-/create_token}
      - HANBIRO_SSO_RAW=${DEV_HANBIRO_SSO_RAW:-1}
      - HANBIRO_SSO_METHOD=${DEV_HANBIRO_SSO_METHOD:-mail}
      - TZ=Asia/Seoul
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - dev-network

  mysql:
    image: mysql:8.0
    container_name: groupware-mysql-dev
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_DATABASE=groupware_dev
      - MYSQL_USER=${DEV_DB_USERNAME:-groupware_dev}
      - MYSQL_PASSWORD=${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      - MYSQL_ROOT_PASSWORD=${DEV_DB_ROOT_PASSWORD:?DEV_DB_ROOT_PASSWORD is required}
      - TZ=Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: groupware-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped
    networks:
      - dev-network

volumes:
  mysql-dev-data:
    name: mysql-dev-data
    driver: local
  redis-dev-data:
    name: redis-dev-data
    driver: local

networks:
  dev-network:
    name: dev-network
    driver: bridge
