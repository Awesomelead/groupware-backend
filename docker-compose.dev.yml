version: '3.8'

services:
  app:
    image: ${DEV_BACKEND_IMAGE:-188932086032.dkr.ecr.ap-northeast-2.amazonaws.com/groupware-backend:dev}
    container_name: groupware-backend-dev
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/groupware_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${DEV_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DEV_DB_PASSWORD}
      - SPRING_JWT_SECRET=${JWT_SECRET}
      - SPRING_JWT_ACCESS_VALIDATION=${JWT_ACCESS_VALIDATION}
      - SPRING_JWT_REFRESH_VALIDATION=${JWT_REFRESH_VALIDATION}
      - SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${DEV_AWS_S3_ACCESS_KEY}
      - SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY=${DEV_AWS_S3_SECRET_KEY}
      - SPRING_CLOUD_AWS_S3_BUCKET=${DEV_AWS_S3_BUCKET}
      - SPRING_CLOUD_AWS_REGION_STATIC=ap-northeast-2
      - ALIGO_API_URL=${ALIGO_API_URL}
      - ALIGO_API_APIKEY=${ALIGO_API_KEY}
      - ALIGO_API_USERID=${ALIGO_USER_ID}
      - ALIGO_API_SENDERKEY=${ALIGO_SENDER_KEY}
      - ALIGO_API_SENDER=${ALIGO_SENDER_PHONE}
      - ALIGO_API_TPL_CODE=${ALIGO_TPL_CODE}
      - ALIGO_API_TEST_MODE=${ALIGO_TEST_MODE}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${DEV_SPRING_JPA_HIBERNATE_DDL_AUTO}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - ENCRYPTION_SECRET_KEY=${ENCRYPTION_SECRET_KEY}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT}
      - PORTONE_APISECRET=${PORTONE_APISECRET}
      - FIREBASE_CREDENTIALS_JSON=${DEV_FIREBASE_CREDENTIALS_JSON:-}
      - MULTIPART_MAX_FILE_SIZE=${MULTIPART_MAX_FILE_SIZE}
      - MULTIPART_MAX_REQUEST_SIZE=${MULTIPART_MAX_REQUEST_SIZE}
      - TOMCAT_MAX_HTTP_FORM_POST_SIZE=${TOMCAT_MAX_HTTP_FORM_POST_SIZE}
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=${MULTIPART_MAX_FILE_SIZE}
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=${MULTIPART_MAX_REQUEST_SIZE}
      - SERVER_TOMCAT_MAX_HTTP_FORM_POST_SIZE=${TOMCAT_MAX_HTTP_FORM_POST_SIZE}
      - HANBIRO_SSO_BASE_URL=${HANBIRO_SSO_BASE_URL}
      - HANBIRO_SSO_AUTH_PATH=${HANBIRO_SSO_AUTH_PATH}
      - HANBIRO_SSO_CREATE_TOKEN_PATH=${HANBIRO_SSO_CREATE_TOKEN_PATH}
      - HANBIRO_SSO_RAW=${HANBIRO_SSO_RAW}
      - HANBIRO_SSO_METHOD=${HANBIRO_SSO_METHOD}
      - TZ=Asia/Seoul
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - dev-network

  mysql:
    image: mysql:8.0
    container_name: groupware-mysql-dev
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      - MYSQL_DATABASE=groupware_dev
      - MYSQL_USER=${DEV_DB_USERNAME:-groupware_dev}
      - MYSQL_PASSWORD=${DEV_DB_PASSWORD:?DEV_DB_PASSWORD is required}
      - MYSQL_ROOT_PASSWORD=${DEV_DB_ROOT_PASSWORD:?DEV_DB_ROOT_PASSWORD is required}
      - TZ=Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: groupware-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    restart: unless-stopped
    networks:
      - dev-network

  prometheus:
    image: prom/prometheus
    container_name: groupware-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - dev-network

  grafana:
    image: grafana/grafana
    container_name: groupware-grafana-dev
    ports:
      - "3000:3000"
    volumes:
      - grafana-dev-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - dev-network

volumes:
  mysql-dev-data:
    name: mysql-dev-data
    driver: local
  redis-dev-data:
    name: redis-dev-data
    driver: local
  grafana-dev-data:
    name: grafana-dev-data
    driver: local

networks:
  dev-network:
    name: dev-network
    driver: bridge
